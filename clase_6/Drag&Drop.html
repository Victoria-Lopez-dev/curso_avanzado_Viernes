<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase7- Drag and Drop</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1 id="tituloUnico" draggable="true">Drag and Drop</h1>
    <h2 >Otro titulo</h2>
    <a href="https://www.google.com" target="_blank" onclick="preventRedirect(event)">Ancla a algun lado...</a>
    <div class="zona-destino" 
    ondragenter="fnEntrada()" 
    ondragleave="fnSlaida()" 
    ondragover="fnContEleDestino(event)" 
    ondrop="fnElemSoltado(event)">
        arrastar elemento aqui..
    </div>
    <button draggable="true" onclick="reincio()">Reiniciar..</button>
    <img  id="cohete"  src="./imagenes/cohete.jpg" alt="cohete">
    <script src="./d&d.js"></script>
</body>
</html>
